# sha256      : SHA-256 of the upstream release archive at `url`.
# tree_sha256 : SHA-256 of the vendored tree as committed: for every file under the
#               directory (`path`, relative paths with '/'), the line
#               "<relative path>\0<hex sha256 of the contents>\n"; lines sorted bytewise,
#               concatenated and hashed. Local changes to vendored files change this value.
# linked      : true if the code ends up in the keepterm binary (license gate).

